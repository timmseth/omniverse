<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omniverse Note Wizard</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1f1d1a;--mute:#6b665e;--line:#ddd7cb;--accent:#5b3fa8;--accent-ink:#fff;--ok:#1d7a46;--warn:#9a6700;--err:#b3261e;--code:#f0ece3;--chip:#ece6f7}
@media (prefers-color-scheme:dark){:root{--bg:#16141a;--panel:#201d27;--ink:#ece8f2;--mute:#a49eb3;--line:#38334a;--accent:#a68bf0;--accent-ink:#14111c;--ok:#5fcf8d;--warn:#e0b04a;--err:#ff8a80;--code:#191622;--chip:#2e2845}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;padding:.8rem 1rem;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:1.1rem;margin:0;flex:1 1 auto}
header .tools{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.status{font-size:.8rem;color:var(--mute)}
.status b{color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:1rem}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:.45rem .8rem;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.4rem .55rem;width:100%}
textarea{resize:vertical;min-height:4.5rem}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.steps{display:flex;gap:.5rem;margin:0 0 1rem;font-size:.85rem;color:var(--mute)}
.steps span.on{color:var(--ink);font-weight:600}
.intro{color:var(--mute);margin:.2rem 0 1rem}
.search{max-width:360px;margin-bottom:1rem}
h2.group{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:1.2rem 0 .5rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.7rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.8rem;text-align:left;display:flex;flex-direction:column;gap:.3rem;min-height:110px}
.card:hover{border-color:var(--accent)}
.card b{font-size:1rem}
.card span.sum{color:var(--mute);font-size:.82rem;flex:1}
.chip{display:inline-block;background:var(--chip);color:var(--ink);border-radius:999px;padding:.05rem .55rem;font-size:.72rem;width:fit-content}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1rem;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:1rem}
.panel h3{margin:.1rem 0 .7rem;font-size:1rem}
.field{margin:0 0 .8rem}
.lab{font-weight:600;font-size:.88rem;margin-bottom:.15rem}
.lab .req{color:var(--err);margin-left:.15rem}
.doc{color:var(--mute);font-size:.78rem;margin:0 0 .25rem}
.row{display:flex;gap:.4rem;align-items:flex-start;margin-bottom:.35rem}
.row>.grow{flex:1;min-width:0}
.row button{flex:0 0 auto}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 .7rem;padding:.6rem .7rem}
legend{font-size:.8rem;color:var(--mute);padding:0 .3rem}
details{margin:.4rem 0 1rem}
details>summary{cursor:pointer;font-weight:600;margin-bottom:.6rem}
.when{display:grid;grid-template-columns:150px 1fr 1fr 1fr;gap:.4rem}
@media (max-width:560px){.when{grid-template-columns:1fr 1fr}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.refnote{font-size:.74rem;color:var(--mute);margin-top:.15rem;min-height:1em}
.refnote.bad{color:var(--warn)}
.preview{position:sticky;top:.6rem}
pre.out{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:.7rem;overflow:auto;max-height:46vh;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;margin:.4rem 0}
.path{font:12.5px ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.probs{list-style:none;margin:.3rem 0;padding:0;font-size:.84rem}
.probs li{padding:.1rem 0}
.probs .error{color:var(--err)}
.probs .warn{color:var(--warn)}
.probs .ok{color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0}
.basket{margin-top:1rem;border-top:1px solid var(--line);padding-top:.7rem}
.basket li{display:flex;gap:.5rem;align-items:center;justify-content:space-between;font-size:.84rem;padding:.2rem 0}
.toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem .9rem;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw}
.toast.show{opacity:1}
.hint{background:var(--chip);border-radius:10px;padding:.6rem .8rem;margin:0 0 1rem;font-size:.86rem}
.link{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline}
</style>
</head>
<body>
<header>
  <h1>Omniverse Note Wizard</h1>
  <div class="tools">
    <span class="status" id="worldStatus"></span>
    <button id="btnRepo" title="Pick your Omniverse repo folder: loads the world index and lets you save notes straight into it">Open repo folder</button>
    <button id="btnWorld" title="Load _generated/world.json so references can be checked">Load world.json</button>
    <input type="file" id="fileWorld" accept=".json,application/json" hidden>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

    const mode = h('select', { 'aria-label': aria + ' kind of date', onchange: e => { st.mode = e.target.value; draw(); changed(); } },
      h('option', { value: 'primordial', selected: st.mode === 'primordial' }, 'primordial'),
      (spec.nullable || key === 'to') ? h('option', { value: 'null', selected: st.mode === 'null' }, 'none (still exists)') : null,
      h('option', { value: 'date', selected: st.mode === 'date' }, 'a date'));
    nums.append(mode);
    if (st.mode === 'date') {
      nums.append(textInput(st, 'year', 'year', aria + ' year'), textInput(st, 'day', 'day', aria + ' day'), textInput(st, 'era', 'era (optional)', aria + ' era'));
    }
  };
  draw();
  return nums;
}
function listControl(spec, holder, key, aria) {
  const o = listOf(spec);
  if (!Array.isArray(holder[key])) holder[key] = [];
  const arrState = holder[key];
  const box = h('div');
  const draw = () => {
    box.replaceChildren();
    arrState.forEach((_, i) => {
      const ctl = makeControl(o, arrState, i, aria + ' ' + (i + 1));
      box.append(h('div', { class: 'row' }, h('div', { class: 'grow' }, ctl),
        h('button', { type: 'button', title: 'Remove', 'aria-label': 'Remove item', onclick: () => { arrState.splice(i, 1); draw(); changed(); } }, '×')));
    });
    box.append(h('button', { type: 'button', onclick: () => { arrState.push(defaultState(o)); draw(); changed(); } }, '+ Add'));
  };
  draw();
  return box;
}
function mapControl(spec, holder, key, aria) {
  if (!holder[key] || typeof holder[key] !== 'object' || Array.isArray(holder[key])) holder[key] = defaultState(spec);
  const st = holder[key];
  const fs = h('fieldset', null, h('legend', null, aria));
  for (const [k, s] of Object.entries(spec.fields)) {
    if (norm(s).type === 'const') continue;
    if (st[k] === undefined) st[k] = defaultState(s, k);
    fs.append(labelled(k, s, makeControl(s, st, k, aria + ' ' + k)));
  }
  return fs;
}
function kvControl(holder, key, aria) {
  if (!Array.isArray(holder[key])) holder[key] = [];
  const rows = holder[key];
  const box = h('div');
  const draw = () => {
    box.replaceChildren();
    rows.forEach((r, i) => box.append(h('div', { class: 'row' },
      h('div', { class: 'grow' }, textInput(r, 'k', 'key', aria + ' key')),
      h('div', { class: 'grow' }, textInput(r, 'v', 'value', aria + ' value')),
      h('button', { type: 'button', 'aria-label': 'Remove row', onclick: () => { rows.splice(i, 1); draw(); changed(); } }, '×'))));
    box.append(h('button', { type: 'button', onclick: () => { rows.push({ k: '', v: '' }); draw(); } }, '+ Add'));
  };
  draw();
  return box;
}

// ---- choose step ----
function renderChoose() {
  state.step = 'choose';
  const q = state.search.toLowerCase();
  const wrap = h('div');
  wrap.append(
    h('div', { class: 'steps' }, h('span', { class: 'on' }, '1. Choose'), h('span', null, '2. Fill in and export')),
    h('p', { class: 'intro' }, 'Pick what you are making. The wizard asks for the right fields, checks them against the schemas, and writes a valid Omniverse note you can copy, download, or save straight into your repo. The chips show how big a creation is in a Genesis Session and what it costs in Entropy.'),
    h('input', { class: 'search', type: 'search', placeholder: 'Search kinds (for example: god, town, person)', value: state.search, 'aria-label': 'Search kinds',
      oninput: e => { state.search = e.target.value; const pos = e.target.selectionStart; renderChoose(); const i = document.querySelector('.search'); i.focus(); i.setSelectionRange(pos, pos); } }));
  let shown = 0;
  for (const [title, kinds] of KIND_GROUPS) {
    const items = kinds.filter(k => SCHEMA.kinds[k] && (!q || (k + ' ' + SCHEMA.kinds[k].title + ' ' + SCHEMA.kinds[k].summary + ' ' + (GENESIS[k] ? GENESIS[k][1] : '')).toLowerCase().includes(q)));
    if (!items.length) continue;
    shown += items.length;
    wrap.append(h('h2', { class: 'group' }, title), h('div', { class: 'cards' }, items.map(k => {
      const g = GENESIS[k];
      return h('button', { class: 'card', type: 'button', onclick: () => startKind(k) },
        h('b', null, SCHEMA.kinds[k].title), h('span', { class: 'sum' }, SCHEMA.kinds[k].summary), g ? h('span', { class: 'chip' }, g[0] + ' \u00b7 ' + WEIGHTS[g[0]] + ' Entropy') : null);
    })));
  }
  if (!shown) wrap.append(h('p', { class: 'intro' }, 'No kinds match.'));
  if (state.basket.length) wrap.append(renderBasket());
  app.replaceChildren(wrap);
}

// ---- fill step ----
function newForm(kind, keepUniverse) {
  const f = kindFields(kind);
  const form = {
    kind, universeName: keepUniverse || store('ov.universe') || '', name: '', parent: '', body: '', bodyTouched: false,
    idVariant: 0, folderVariant: 0, idTouched: false, pathTouched: false, idOverride: '', pathOverride: '', vars: {}, values: {}
  };
  for (const k of formFields(kind)) form.values[k] = defaultState(f[k], k);
  const au = store('ov.author');
  if (au && 'author' in form.values) form.values.author = au;
  return form;
}
function startKind(kind, keepUniverse) {
  state.form = newForm(kind, keepUniverse);
  state.step = 'fill';
  renderFill();
  window.scrollTo(0, 0);
}
let ui = {};
function renderFill() {
  const form = state.form, kind = form.kind, s = SCHEMA.kinds[kind], f = kindFields(kind);
  universeList();
  ui = {};
  const g = GENESIS[kind];
  const left = h('div');
  left.append(
    h('div', { class: 'steps' }, h('button', { class: 'link', type: 'button', onclick: renderChoose }, '1. Choose'), h('span', { class: 'on' }, '2. Fill in and export')),
    h('h2', { style: 'margin:.2rem 0 .6rem' }, s.title));
  if (g) left.append(h('div', { class: 'hint' }, h('b', null, 'Genesis ' + g[0] + ' (' + WEIGHTS[g[0]] + ' Entropy): '), g[1]));
  if (NOTES[kind]) left.append(h('div', { class: 'hint' }, NOTES[kind]));

  // basics
  const basics = h('div', { class: 'panel' }, h('h3', null, 'The basics'));
  if (kind !== 'universe') {
    basics.append(h('div', { class: 'field' }, h('div', { class: 'lab' }, 'Universe', h('span', { class: 'req' }, '*')),
      h('div', { class: 'doc' }, 'The world this belongs to. Pick an existing one or type a new name.'),
      h('input', { type: 'text', list: 'dl_universes', value: form.universeName, 'aria-label': 'Universe', autocomplete: 'off',
        oninput: e => { form.universeName = e.target.value; store('ov.universe', e.target.value); changed(); } })));
  }
  basics.append(h('div', { class: 'field' }, h('div', { class: 'lab' }, 'Name', h('span', { class: 'req' }, '*')),
    h('div', { class: 'doc' }, 'The proper name. It becomes the file name, and wikilinks use it, so it must be unique.'),
    h('input', { type: 'text', value: form.name, 'aria-label': 'Name', oninput: e => { form.name = e.target.value; changed(); } })));
  const ps = norm(f.parent);
  basics.append(labelled('parent', { type: 'ref', kinds: ps.kinds, required: true, doc: (ps.doc || 'The note this one sits under.') + (ps.kinds && ps.kinds.includes('universe') ? ' Leave blank to put it directly under the universe.' : '') },
    makeControl({ type: 'ref', kinds: ps.kinds }, form, 'parent', 'parent')));
  left.append(basics);

  // where it lives
  const where = h('details', { class: 'panel', open: neededVars(form).length > 0 }, h('summary', null, 'Where it lives (id and file path)'));
  ui.where = where;
  const ids = arr(s.id), fos = arr(s.folder);
  if (ids.length > 1) where.append(h('div', { class: 'field' }, h('div', { class: 'lab' }, 'Id pattern'),
    h('select', { 'aria-label': 'Id pattern', onchange: e => { form.idVariant = +e.target.value; ui.vars = null; renderVars(); changed(); } }, ids.map((x, i) => h('option', { value: i, selected: i === form.idVariant }, x)))));
  if (fos.length > 1) where.append(h('div', { class: 'field' }, h('div', { class: 'lab' }, 'Folder'),
    h('select', { 'aria-label': 'Folder', onchange: e => { form.folderVariant = +e.target.value; renderVars(); changed(); } }, fos.map((x, i) => h('option', { value: i, selected: i === form.folderVariant }, x)))));
  ui.varsBox = h('div', { class: 'two' });
  where.append(ui.varsBox);
  ui.idIn = h('input', { type: 'text', 'aria-label': 'Id', oninput: e => { form.idTouched = true; form.idOverride = e.target.value; changed(); } });
  ui.pathIn = h('input', { type: 'text', 'aria-label': 'File path', oninput: e => { form.pathTouched = true; form.pathOverride = e.target.value; changed(); } });
  where.append(h('div', { class: 'field' }, h('div', { class: 'lab' }, 'Id'), h('div', { class: 'doc' }, 'Permanent. Built from the universe and name; edit only if you must.'), ui.idIn,
      h('button', { class: 'link', type: 'button', onclick: () => { form.idTouched = false; changed(); } }, 'reset')),
    h('div', { class: 'field' }, h('div', { class: 'lab' }, 'File path'), h('div', { class: 'doc' }, 'Relative to the repo root.'), ui.pathIn,
      h('button', { class: 'link', type: 'button', onclick: () => { form.pathTouched = false; changed(); } }, 'reset')));
  left.append(where);
  renderVars();

  // fields
  const names = formFields(kind).filter(k => k !== 'parent');
  const req = names.filter(k => norm(f[k]).required);
  const opt = names.filter(k => !norm(f[k]).required);
  if (req.length) {
    const p = h('div', { class: 'panel' }, h('h3', null, 'Required'));
    req.forEach(k => p.append(labelled(k, f[k], makeControl(f[k], form.values, k, k))));
    left.append(p);
  }
  if (opt.length) {
    const p = h('details', { class: 'panel', open: !req.length }, h('summary', null, 'More fields (' + opt.length + ')'));
    opt.forEach(k => p.append(labelled(k, f[k], makeControl(f[k], form.values, k, k))));
    left.append(p);
  }
  const bodyBox = h('div', { class: 'panel' }, h('h3', null, 'Body'),
    h('div', { class: 'doc' }, 'Markdown. Link other notes with [[Name]]. Starts with the note title; write the story below it.'));
  ui.body = h('textarea', { rows: 10, 'aria-label': 'Body', oninput: e => { form.body = e.target.value; form.bodyTouched = true; changed(); } });
  bodyBox.append(ui.body);
  left.append(bodyBox);

  // right column
  const right = h('aside', { class: 'preview' });
  const box = h('div', { class: 'panel' }, h('h3', null, 'Your note'));
  ui.path = h('div', { class: 'path' });
  ui.probs = h('ul', { class: 'probs' });
  ui.out = h('pre', { class: 'out' });
  ui.btnSave = h('button', { class: 'primary', type: 'button', onclick: saveToRepo }, canPick ? 'Save into repo folder' : 'Save (needs Chrome or Edge)');
  ui.btnSave.disabled = !canPick;
  box.append(ui.path, ui.probs, ui.out, h('div', { class: 'actions' },
    ui.btnSave,
    h('button', { type: 'button', onclick: copyText }, 'Copy'),
    h('button', { type: 'button', onclick: downloadOne }, 'Download .md'),
    h('button', { type: 'button', onclick: () => addToBasket(false) }, 'Add to basket'),
    h('button', { type: 'button', onclick: () => addToBasket(true) }, 'Add and make another')));
  right.append(box);
  ui.basketHost = h('div');
  right.append(ui.basketHost);
  app.replaceChildren(h('div', { class: 'cols' }, left, right));
  ui.body.value = form.body;
  refreshPreview();
}
function renderVars() {
  const form = state.form;
  ui.varsBox.replaceChildren();
  ui.varInputs = {};
  for (const k of neededVars(form)) {
    const inp = h('input', { type: 'text', 'aria-label': VAR_LABELS[k] || k, oninput: e => { form.vars[k] = e.target.value; changed(); } });
    ui.varInputs[k] = inp;
    ui.varsBox.append(h('div', { class: 'field' }, h('div', { class: 'lab' }, VAR_LABELS[k] || k), inp));
  }
}
let current = null;
function refreshPreview() {
  if (state.step !== 'fill' || !state.form) return;
  const form = state.form;
  const extra = new Set(state.basket.map(b => b.id));
  const note = buildNote(form, state.W, extra);
  current = note;
  for (const [k, inp] of Object.entries(ui.varInputs || {})) {
    if (document.activeElement === inp) continue;
    const v = (k in form.vars) ? form.vars[k] : (note.ctx.derived[k] || '');
    if (inp.value !== v) inp.value = v;
  }
  if (document.activeElement !== ui.idIn) ui.idIn.value = note.id;
  if (document.activeElement !== ui.pathIn) ui.pathIn.value = note.path;
  if (!form.bodyTouched && document.activeElement !== ui.body) ui.body.value = '# ' + note.ctx.name + '\n';
  if (note.problems.some(p => p.msg.startsWith('Fill in:') || p.msg.includes('not where a'))) ui.where.open = true;
  ui.path.textContent = (note.path || '(file path pending)') + (note.files.length > 1 ? '  (+ ' + note.files.slice(1).map(f => fileName(f.path)).join(', ') + ' in the same folder)' : '');
  ui.out.textContent = note.text;
  ui.probs.replaceChildren();
  if (!note.problems.length) ui.probs.append(h('li', { class: 'ok' }, 'Looks valid' + (state.W ? '.' : ' (references not checked: load the world index).')));
  note.problems.forEach(p => ui.probs.append(h('li', { class: p.level }, (p.level === 'error' ? 'Fix: ' : 'Check: ') + p.msg)));
  renderBasketInto(ui.basketHost);
}
function ensureOk() {
  if (!current) return false;
  if (current.errors && !confirm('This note has ' + current.errors + ' problem(s) the validator will reject. Export it anyway?')) return false;
  return true;
}
async function copyText() {
  if (!ensureOk()) return;
  try { await navigator.clipboard.writeText(current.text); toast('Copied'); }
  catch (e) { ui.out.focus(); const r = document.createRange(); r.selectNodeContents(ui.out); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Select and copy the text shown'); }
}
function fileName(path) { return path.split('/').pop() || 'note.md'; }
function downloadOne() {
  if (!ensureOk()) return;
  if (current.files.length > 1) {
    download(slugify(current.ctx.name) + '.zip', makeZip(current.files));
    toast('Unzip into the repo root so each file lands at its path');
    return;
  }
  download(fileName(current.path), new Blob([current.text], { type: 'text/markdown' }));
  toast('Downloaded ' + fileName(current.path) + '. Put it at ' + current.path);
}
async function saveToRepo() {
  if (!ensureOk()) return;
  const root = state.repo || await connectRepo();
  if (!root) return;
  try {
    let ok = false;
    for (const f of current.files) ok = (await writeToRepo(root, f.path, f.text)) || ok;
    if (ok) { toast('Saved ' + current.path); rememberAuthor(); }
  } catch (e) { toast('Could not save: ' + (e && e.message || e)); }
}
function rememberAuthor() { const a = state.form && state.form.values && state.form.values.author; if (typeof a === 'string' && a.trim()) store('ov.author', a.trim()); }

// ---- basket ----
function persistBasket() { store('ov.basket', JSON.stringify(state.basket)); }
function addToBasket(another) {
  if (!ensureOk()) return;
  const item = { kind: state.form.kind, name: current.ctx.name, id: current.id, path: current.path, text: current.text, files: current.files };
  state.basket = state.basket.filter(b => b.path !== item.path).concat(item);
  persistBasket(); rememberAuthor();
  toast('Added ' + item.name + ' to the basket');
  if (another) startKind(state.form.kind, state.form.universeName); else renderBasketInto(ui.basketHost);
}
function renderBasket() { const d = h('div'); renderBasketInto(d); return d; }
function renderBasketInto(host) {
  if (!host) return;
  host.replaceChildren();
  if (!state.basket.length) return;
  host.append(h('div', { class: 'panel basket' }, h('h3', null, 'Basket (' + state.basket.length + ')'),
    h('ul', { style: 'list-style:none;margin:0;padding:0' }, state.basket.map(b => h('li', null,
      h('span', null, b.name + ' ', h('span', { class: 'chip' }, b.kind)),
      h('button', { type: 'button', 'aria-label': 'Remove ' + b.name, onclick: () => { state.basket = state.basket.filter(x => x !== b); persistBasket(); renderBasketInto(host); } }, '×')))),
    h('div', { class: 'actions' },
      h('button', { class: 'primary', type: 'button', disabled: !canPick, onclick: saveAll }, 'Save all into repo folder'),
      h('button', { type: 'button', onclick: zipAll }, 'Download all (zip)'),
      h('button', { type: 'button', onclick: () => { if (confirm('Empty the basket?')) { state.basket = []; persistBasket(); renderBasketInto(host); } } }, 'Clear'))));
}
async function saveAll() {
  const root = state.repo || await connectRepo();
  if (!root) return;
  let n = 0;
  for (const b of state.basket) {
    try { let ok = false; for (const f of (b.files || [{ path: b.path, text: b.text }])) ok = (await writeToRepo(root, f.path, f.text)) || ok; if (ok) n++; }
    catch (e) { toast('Could not save ' + b.path); }
  }
  toast('Saved ' + n + ' of ' + state.basket.length + ' notes');
}
function zipAll() {
  download('omniverse-notes.zip', makeZip(state.basket.flatMap(b => b.files || [{ path: b.path, text: b.text }])));
  toast('Unzip into the repo root so each note lands at its path');
}

// ---- boot ----
$('btnRepo').addEventListener('click', connectRepo);
$('btnWorld').addEventListener('click', () => $('fileWorld').click());
$('fileWorld').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try { setWorld(JSON.parse(await file.text()), 'file'); toast('World index loaded'); } catch (err) { toast('Could not read that file.'); }
  e.target.value = '';
});
try { const b = JSON.parse(store('ov.basket') || '[]'); if (Array.isArray(b)) state.basket = b.filter(x => x && x.path && x.text); } catch (e) { /* ignore */ }
updateStatus();
const qp = new URLSearchParams(location.search);
if (qp.get('universe')) store('ov.universe', qp.get('universe'));
if (qp.get('kind') && SCHEMA.kinds[qp.get('kind')]) startKind(qp.get('kind')); else renderChoose();
if (/^https?:/.test(location.protocol)) fetch('world.json').then(r => r.ok ? r.json() : null).then(j => { if (j) setWorld(j, 'site'); }).catch(() => {});
window.OVW = { SCHEMA, state, buildNote, newForm, formFields, kindFields, fieldOrder, toFileText, startKind, slugify, makeZip, setWorld, refreshPreview, renderChoose };
</script>
</body>
</html>
