<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Genesis Table · Omniverse</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1f1d1a;--mute:#6b665e;--line:#ddd7cb;--accent:#5b3fa8;--accent-ink:#fff;--ok:#1d7a46;--warn:#9a6700;--err:#b3261e;--chip:#ece6f7;--secret:#2a2333;--secret-ink:#f1ecfa}
@media (prefers-color-scheme:dark){:root{--bg:#16141a;--panel:#201d27;--ink:#ece8f2;--mute:#a49eb3;--line:#38334a;--accent:#a68bf0;--accent-ink:#14111c;--ok:#5fcf8d;--warn:#e0b04a;--err:#ff8a80;--chip:#2e2845;--secret:#0f0c14;--secret-ink:#e8e0f8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;padding:.6rem 1rem;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:1.05rem;margin:0}
header .uni{color:var(--mute);font-size:.9rem}
.debt{margin-left:auto;display:flex;gap:.5rem;align-items:center;font-weight:700}
.debt .pill{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:.2rem .8rem;font-size:1.05rem}
.saved{font-size:.75rem;color:var(--mute);font-weight:400}
nav{display:flex;flex-wrap:wrap;gap:.3rem;padding:.5rem 1rem;border-bottom:1px solid var(--line);background:var(--bg)}
nav button{border-radius:999px;padding:.3rem .8rem;font-size:.88rem}
nav button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:1rem}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:.45rem .85rem;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--err)}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;width:100%}
textarea{resize:vertical;min-height:3.2rem}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:1rem}
.panel h2{margin:.1rem 0 .6rem;font-size:1.1rem}
.panel h3{margin:.2rem 0 .5rem;font-size:1rem}
.lead{color:var(--mute);margin:.1rem 0 .9rem}
.field{margin:0 0 .7rem}
.lab{font-weight:600;font-size:.88rem;margin-bottom:.15rem}
.doc{color:var(--mute);font-size:.8rem;margin-bottom:.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.8rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:.05rem .6rem;font-size:.78rem}
.turn{font-size:1.25rem;font-weight:700;margin:.2rem 0}
.sizes{display:flex;flex-wrap:wrap;gap:.4rem}
.sizes button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border-bottom:1px solid var(--line);padding:.35rem .4rem;text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600}
.secret{background:var(--secret);color:var(--secret-ink);border-radius:12px;padding:1rem;margin-bottom:1rem}
.secret input,.secret textarea,.secret select{background:#00000030;color:var(--secret-ink);border-color:#ffffff30}
.secret .doc{color:#cfc6e0}
.veil{filter:blur(6px);user-select:none;pointer-events:none}
.menu label{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem .2rem;border-bottom:1px solid var(--line);cursor:pointer}
.menu label input{width:auto;margin-top:.25rem}
.menu .cost{margin-left:auto;font-weight:700;white-space:nowrap}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:.4rem 0}
.bar>div{height:100%;background:var(--accent)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}
.toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem .9rem;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw}
.toast.show{opacity:1}
.small{font-size:.82rem;color:var(--mute)}
pre{white-space:pre-wrap;word-break:break-word;background:var(--chip);padding:.7rem;border-radius:8px;font-size:.8rem;max-height:40vh;overflow:auto}
</style>
</head>
<body>
<header>
  <h1>Genesis Table</h1>
  <span class="uni" id="uniName"></span>
  <div class="debt"><span class="saved" id="saved"></span><span>Entropy owed</span><span class="pill" id="debt">0</span></div>
</header>
<nav id="nav"></nav>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><main><p>This page needs JavaScript.</p></main></noscript>
<script>
'use strict';
// ==CORE==
const FORMAT = 'omniverse-genesis-ledger';
const VERSION = 1;
const RELAY_URL = 'https://omniverse-relay.mobile-markets.workers.dev';
const ISSUE_URL = 'https://github.com/timmseth/omniverse/issues/new';
const WEIGHT = { World: 5, Grand: 3, Middling: 2, Small: 1, Joint: 3 };
const ROUNDS = { 2: 10, 3: 7, 4: 5, 5: 4, 6: 3, 7: 3, 8: 3 };
const KINDS = {
  Grand: ['continent', 'culture', 'lore', 'plane', 'monster'],
  Middling: ['region', 'country', 'settlement', 'faction', 'monster', 'era', 'event', 'language', 'holiday', 'lore'],
  Small: ['person', 'item', 'venue', 'household', 'lore', 'event'],
  Joint: ['continent', 'culture', 'lore', 'plane', 'faction']
};
const SCALES = [
  ['Scar', 'one place', 4, 'join the relics anywhere'],
  ['Blight', 'a region', 8, 'join the relics anywhere'],
  ['Scourge', 'a nation', 12, 'at one place'],
  ['Cataclysm', 'a continent', 18, 'at one place, at one moment'],
  ['Unmaking', 'the world', 24, 'at one place, at one moment, and one bearer pays a price']
];
const FORMS = ['fire', 'flood', 'plague', 'war', 'famine', 'winter', 'silence', 'rot', 'madness', 'a Domain turned'];
const FORM_COST = 3;
const FEATURES = [
  ['A Face', 4, 'a villain or herald who wants it to come'],
  ['A Clock', 2, 'it arrives at a known time'],
  ['Servants', 3, 'a cult, army or court serves it'],
  ['Spread', 3, 'it grows while ignored'],
  ['A Hunger', 3, 'it wants one specific thing and goes there'],
  ['A Mask', 2, 'it is not what it seems'],
  ['Roots', 2, 'tied to one creation the gods love'],
  ['Echoes', 2, 'it has happened before']
];
const SECRET_KEYS = ['relic', 'truth', 'convergence', 'scribeNotes'];

function newGod(i) {
  return { id: 'g' + (i + 1) + '-' + Math.random().toString(36).slice(2, 6), player: '', name: '', domain: '', sign: '', voice: '', firstWord: '', worldLine: '', proverb: '',
    relic: { what: '', alone: '', joined: '', hidden: '', found: '' },
    avatar: { name: '', concept: '', echo: '', fate: '', lead: '', why: '', remnant: '' } };
}
function newLedger() {
  const now = new Date().toISOString();
  return {
    format: FORMAT, version: VERSION, created: now, updated: now,
    setup: { universe: '', tone: '', ruleset: 'D&D 5e', scribe: '', scribeMode: 'scribe', doomBy: 'council', keeper: '', caveatSpends: false, worldMade: false },
    gods: [newGod(0), newGod(1), newGod(2), newGod(3)],
    acts: [], pacts: [],
    reckoning: { scale: '', form: '', formNote: '', features: [], publicFace: '', truth: '', convergence: '', outcome: '' },
    gathering: { what: '', where: '', when: '' },
    common: ['', '', '', '', '', '', ''],
    log: { notes: '', worked: '', dragged: '', change: '' },
    scribeNotes: ''
  };
}
function rounds(L) { return ROUNDS[Math.min(8, Math.max(2, L.gods.length))]; }
function debt(L) {
  let d = L.setup.worldMade ? WEIGHT.World : 0;
  for (const a of L.acts) d += a.cost || 0;
  if (L.setup.caveatSpends) d -= L.pacts.filter(p => p.outcome === 'refused' && p.caveat).length;
  return Math.max(0, d);
}
function doomSpend(R) {
  let s = 0;
  const sc = SCALES.find(x => x[0] === R.scale); if (sc) s += sc[2];
  if (R.form) s += FORM_COST;
  for (const f of R.features) { const x = FEATURES.find(y => y[0] === f); if (x) s += x[1]; }
  return s;
}
// Snake order: round 1 in claim order, each round reversed.
function turnOrder(L, round) { const ids = L.gods.map(g => g.id); return round % 2 === 1 ? ids : ids.slice().reverse(); }
function actsInRound(L, round) { return L.acts.filter(a => a.round === round); }
function currentTurn(L) {
  const R = rounds(L);
  for (let r = 1; r <= R; r++) {
    const order = turnOrder(L, r), done = actsInRound(L, r).flatMap(a => a.gods);
    for (const id of order) if (!done.includes(id)) return { round: r, godId: id, phase: r === 1 ? 'Foundation' : r === R ? 'Relics' : 'Weaving' };
  }
  return null;
}
function godName(L, id) { const g = L.gods.find(x => x.id === id); return g ? (g.name || g.player || 'a god') : '?'; }
function strip(v) {
  if (Array.isArray(v)) return v.map(strip);
  if (v && typeof v === 'object') { const o = {}; for (const [k, x] of Object.entries(v)) if (!SECRET_KEYS.includes(k)) o[k] = strip(x); return o; }
  return v;
}
function publicLedger(L) { const p = strip(L); p.debt = debt(L); return p; }
function esc(s) { return String(s == null ? '' : s).replace(/\|/g, '\\|').replace(/\n+/g, ' '); }
function ledgerMarkdown(L, withSecrets) {
  const u = L.setup.universe || 'Untitled universe', out = [];
  out.push('# Genesis Ledger: ' + u, '');
  out.push('- Tone: ' + (L.setup.tone || '-') + ' · Ruleset: ' + (L.setup.ruleset || '-') + ' · Scribe: ' + (L.setup.scribe || '-'));
  out.push('- Entropy owed: **' + debt(L) + '** · Doom shaped by: ' + L.setup.doomBy, '');
  out.push('## Gods', '', '| Player | God | Domain | Sign | Voice | First Word |', '|---|---|---|---|---|---|');
  for (const g of L.gods) out.push('| ' + [g.player, g.name, g.domain, g.sign, g.voice, g.firstWord].map(esc).join(' | ') + ' |');
  out.push('', '## The World (5)', '');
  for (const g of L.gods) if (g.worldLine) out.push('- ' + esc(godName(L, g.id)) + ': ' + esc(g.worldLine));
  out.push('', '## Creations', '', '| # | Round | God | Size | Cost | Kind | Name | The Word | Anchor | Mark | Detail | Yes-ands |', '|---|---|---|---|---|---|---|---|---|---|---|---|');
  L.acts.forEach((a, i) => out.push('| ' + [i + 1, a.round, a.gods.map(id => godName(L, id)).join(' + '), a.size, a.cost, a.kind, a.name, a.word, a.anchor, a.mark, a.detail, a.yesands].map(esc).join(' | ') + ' |'));
  out.push('', '## Pacts', '', '| Between | Petition | Offer | Outcome | Caveat | Said |', '|---|---|---|---|---|---|');
  for (const p of L.pacts) out.push('| ' + [p.between.map(id => godName(L, id)).join(' & '), p.petition, p.offer, p.outcome, p.caveat, p.said].map(esc).join(' | ') + ' |');
  out.push('', '## Proverbs', '');
  for (const g of L.gods) if (g.proverb) out.push('- ' + esc(godName(L, g.id)) + ': "' + esc(g.proverb) + '"');
  const R = L.reckoning;
  out.push('', '## The Doom', '', '- Scale: ' + (R.scale || '-') + ' · Form: ' + (R.form || '-') + (R.formNote ? ' (' + esc(R.formNote) + ')' : '') + ' · Features: ' + (R.features.join(', ') || '-'));
  out.push('- Spent: ' + doomSpend(R) + ' of ' + debt(L) + ' · Remainder carried: ' + Math.max(0, debt(L) - doomSpend(R)));
  out.push('- Public face: ' + (esc(R.publicFace) || '-'));
  if (withSecrets) { out.push('- **True Doom (secret):** ' + (esc(R.truth) || '-'), '- **Convergence (secret):** ' + (esc(R.convergence) || '-')); }
  if (withSecrets) {
    out.push('', '## Relics (secret)', '', '| God | Relic | Alone | Joined | Hidden | Found by |', '|---|---|---|---|---|---|');
    for (const g of L.gods) out.push('| ' + [godName(L, g.id), g.relic.what, g.relic.alone, g.relic.joined, g.relic.hidden, g.relic.found].map(esc).join(' | ') + ' |');
  }
  out.push('', '## Incarnation', '', 'Gathering: ' + [L.gathering.what, L.gathering.where, L.gathering.when].filter(Boolean).map(esc).join(', '), '');
  out.push('| Player | Avatar of | Avatar | Concept | Echo | Fate | Lead | Why at the Gathering |', '|---|---|---|---|---|---|---|---|');
  for (const g of L.gods) { const a = g.avatar; out.push('| ' + [g.player, godName(L, g.id), a.name, a.concept, a.echo, a.fate, a.lead, a.why].map(esc).join(' | ') + ' |'); }
  const ck = L.common.filter(Boolean);
  if (ck.length) { out.push('', '## Common Knowledge', ''); ck.forEach((c, i) => out.push((i + 1) + '. ' + esc(c))); }
  if (withSecrets && L.scribeNotes) out.push('', '## Scribe notes (secret)', '', L.scribeNotes);
  return out.join('\n');
}
function validateImport(obj) {
  if (!obj || obj.format !== FORMAT) return 'That file is not a Genesis ledger.';
  if (!Array.isArray(obj.gods) || !Array.isArray(obj.acts)) return 'That ledger is damaged.';
  return null;
}
function migrate(obj) {
  const base = newLedger();
  const L = Object.assign(base, obj);
  L.setup = Object.assign(newLedger().setup, obj.setup || {});
  L.reckoning = Object.assign(newLedger().reckoning, obj.reckoning || {});
  L.gods = (obj.gods || []).map((g, i) => { const d = newGod(i); return Object.assign(d, g, { relic: Object.assign(d.relic, g.relic || {}), avatar: Object.assign(d.avatar, g.avatar || {}) }); });
  L.common = (obj.common || []).concat(['', '', '', '', '', '', '']).slice(0, Math.max(7, (obj.common || []).length));
  return L;
}
// ==/CORE==

const KEY = 'omniverse.genesis.ledger.v1';
let L = load();
let tab = sessionStorage.getItem('gt.tab') || 'setup';
let scribeView = false;
const openRelics = new Set();
const $ = id => document.getElementById(id);
function load() { try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (!validateImport(o)) return migrate(o); } } catch (e) { /* fresh */ } return newLedger(); }
let saveT;
function save() {
  L.updated = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(L)); $('saved').textContent = 'saved ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  catch (e) { $('saved').textContent = 'not saved: export a backup'; }
  $('debt').textContent = debt(L);
  $('uniName').textContent = L.setup.universe || '';
}
function changed() { clearTimeout(saveT); saveT = setTimeout(save, 250); $('debt').textContent = debt(L); }
let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3000); }
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, ''); else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
function inp(obj, key, label, doc, opts) {
  opts = opts || {};
  const ctl = opts.area
    ? h('textarea', { rows: opts.rows || 2, 'aria-label': label, placeholder: opts.ph || '', oninput: e => { obj[key] = e.target.value; changed(); if (opts.after) opts.after(); } }, obj[key] || '')
    : h('input', { type: 'text', value: obj[key] || '', 'aria-label': label, placeholder: opts.ph || '', oninput: e => { obj[key] = e.target.value; changed(); if (opts.after) opts.after(); } });
  return h('div', { class: 'field' }, h('div', { class: 'lab' }, label), doc ? h('div', { class: 'doc' }, doc) : null, ctl);
}
function sel(obj, key, label, options, doc, after) {
  return h('div', { class: 'field' }, h('div', { class: 'lab' }, label), doc ? h('div', { class: 'doc' }, doc) : null,
    h('select', { 'aria-label': label, onchange: e => { obj[key] = e.target.value; changed(); if (after) after(); } },
      options.map(o => { const [v, t] = Array.isArray(o) ? o : [o, o]; return h('option', { value: v, selected: obj[key] === v }, t); })));
}
function godOptions(blank) { return (blank ? [['', blank]] : []).concat(L.gods.map(g => [g.id, godName(L, g.id)])); }

const TABS = [
  ['setup', 'Setup'], ['gods', 'Gods'], ['world', 'World'], ['acts', 'Turns'], ['pacts', 'Deals'],
  ['relics', 'Relics'], ['reckoning', 'Reckoning'], ['incarnation', 'Mortals'], ['ledger', 'Ledger'], ['export', 'Save & submit']
];
function renderNav() {
  $('nav').replaceChildren(...TABS.map(([k, t]) => h('button', { type: 'button', class: k === tab ? 'on' : '', onclick: () => go(k) }, t)));
}
function go(k) { tab = k; sessionStorage.setItem('gt.tab', k); render(); window.scrollTo(0, 0); }
function render() {
  renderNav();
  const f = { setup: vSetup, gods: vGods, world: vWorld, acts: vActs, pacts: vPacts, relics: vRelics, reckoning: vReckoning, incarnation: vMortals, ledger: vLedger, export: vExport }[tab] || vSetup;
  $('app').replaceChildren(f());
  $('debt').textContent = debt(L);
  $('uniName').textContent = L.setup.universe || '';
}
function next(k, label) { return h('div', { class: 'row' }, h('button', { class: 'primary', type: 'button', onclick: () => go(k) }, label + ' →')); }

// ---- views ----
function vSetup() {
  const p = h('div');
  p.append(h('div', { class: 'panel' }, h('h2', null, 'Set up the table'),
    h('p', { class: 'lead' }, 'One screen in the middle of the table. Everything saves in this browser as you type, so a reload loses nothing. Take a backup from "Save & submit" now and then.'),
    h('div', { class: 'two' },
      inp(L.setup, 'universe', 'Universe name', 'You can name it at the end, too.'),
      inp(L.setup, 'tone', 'Tone', 'Parody, grim, mythic, cozy...'),
      inp(L.setup, 'ruleset', 'Ruleset', 'The system the mortals will play.'),
      inp(L.setup, 'scribe', 'Scribe (who runs the table)')),
    h('div', { class: 'two' },
      sel(L.setup, 'scribeMode', 'How the Scribe plays', [['scribe', 'Scribe only'], ['god', 'God only (shapes the Doom, never incarnates)'], ['both', 'God and avatar (small tables)']]),
      sel(L.setup, 'doomBy', 'Who shapes the Doom', [['council', 'Council: the whole table'], ['keeper', 'Doom-Keeper: one god, privately'], ['mixed', 'Mixed: Council picks the Doom, Keeper the Convergence']], null, render)),
    L.setup.doomBy !== 'council' ? sel(L.setup, 'keeper', 'Doom-Keeper', godOptions('(choose a god)')) : null,
    h('label', { class: 'row small' }, h('input', { type: 'checkbox', style: 'width:auto', checked: !!L.setup.caveatSpends, onchange: e => { L.setup.caveatSpends = e.target.checked; changed(); } }), 'Option: a refused deal\'s Caveat spends 1 Entropy')));
  const gp = h('div', { class: 'panel' }, h('h2', null, 'Players (' + L.gods.length + ')'),
    h('p', { class: 'lead' }, 'In the order they will claim their Domains. That is the turn order. ' + rounds(L) + ' rounds for ' + L.gods.length + ' gods.'));
  L.gods.forEach((g, i) => gp.append(h('div', { class: 'row', style: 'margin-bottom:.4rem' },
    h('div', { style: 'flex:1' }, h('input', { type: 'text', value: g.player, placeholder: 'Player ' + (i + 1), 'aria-label': 'Player ' + (i + 1), oninput: e => { g.player = e.target.value; changed(); } })),
    h('button', { type: 'button', disabled: i === 0, title: 'Move up', 'aria-label': 'Move up', onclick: () => { [L.gods[i - 1], L.gods[i]] = [L.gods[i], L.gods[i - 1]]; changed(); render(); } }, '↑'),
    h('button', { type: 'button', class: 'danger', disabled: L.gods.length <= 2 || L.acts.length > 0, title: 'Remove', 'aria-label': 'Remove player', onclick: () => { if (confirm('Remove this player?')) { L.gods.splice(i, 1); changed(); render(); } } }, '×'))));
  gp.append(h('div', { class: 'row' },
    h('button', { type: 'button', disabled: L.gods.length >= 8 || L.acts.length > 0, onclick: () => { L.gods.push(newGod(L.gods.length)); changed(); render(); } }, '+ Add player'),
    L.acts.length ? h('span', { class: 'small' }, 'Players are locked once turns have started.') : null));
  p.append(gp, next('gods', 'Make the gods'));
  return p;
}
function vGods() {
  const p = h('div', null, h('div', { class: 'panel' }, h('h2', null, 'Apotheosis: make your gods'),
    h('p', { class: 'lead' }, 'Free. Domains must differ. Then go round once: each god says one sentence that was true before anything existed.')));
  const doms = L.gods.map(g => g.domain.trim().toLowerCase()).filter(Boolean);
  const grid = h('div', { class: 'grid' });
  for (const g of L.gods) {
    const dup = g.domain && doms.filter(d => d === g.domain.trim().toLowerCase()).length > 1;
    grid.append(h('div', { class: 'panel' }, h('h3', null, g.player || 'Player'),
      inp(g, 'name', 'God\'s name', 'What mortals call you.'),
      inp(g, 'domain', 'Domain', 'Two words at most: Tides, Bargains, Forgotten Things.', { after: () => {} }),
      dup ? h('div', { class: 'small warn' }, 'Another god has this Domain.') : null,

  const url = ISSUE_URL + '?title=' + encodeURIComponent('Genesis submission: ' + (L.setup.universe || 'Untitled')) + '&labels=genesis&body=' + encodeURIComponent(head + md);
  window.open(url, '_blank', 'noopener');
}
