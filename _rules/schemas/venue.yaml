kind: venue
title: Venue
summary: A tavern, shop, temple, guildhall or other place inside a settlement that a party can walk into.
module: core
folder: Multiverse/<Universe>/<Place path>/<Name>/Venues/<Name>.md
id: <universe>.venue.<slug>
mixins: [base, in_universe, dated]
fields:
  parent: { type: ref, kinds: [settlement, district], required: true }
  venue_type: { type: enum, values: [tavern, inn, shop, smith, temple, shrine, guildhall, market, library, jail, manor, hall, stable, dock, academy, other], required: true }
  keeper: { type: ref, kinds: [person], doc: "Who runs it." }
  faction: { type: ref, kinds: [faction], doc: "Who owns or controls it, if not the keeper." }
  services: { type: list, of: string, doc: "What you can buy or do here, with prices if they matter." }
  stock: { type: list, of: { type: ref, kinds: [item] }, doc: "Notable items for sale." }
  rumours: { type: list, of: string }
  hooks: { type: list, of: string }
  read_aloud: { type: text, doc: "What the party sees when they walk in." }
  dm_notes: { type: text }
  for_quest:
    type: list
    doc: "Detail that only applies while a quest is active. The app shows an entry when that quest is active in the run (arrival), after the DM taps Investigate (investigation), or once the quest has reached the stage (stage). Nothing shows for quests the party is not on."
    of:
      type: map
      fields:
        quest: { type: ref, kinds: [quest], required: true }
        when: { type: enum, values: [arrival, investigation, stage], required: true }
        stage: { type: int, doc: "Required when `when: stage`: the 1-based stage of the quest from which this applies." }
        read_aloud: { type: text, doc: "What the party notices, as read aloud." }
        dm_notes: { type: text, doc: "What it means, for the DM." }
        clue: { type: string, doc: "What it points to next." }
