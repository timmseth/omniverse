# Field sets shared by many kinds. A schema lists them under `mixins:`.
base:
  id:       { type: id, required: true, doc: "Namespaced id, unique across the repository." }
  kind:     { type: string, required: true, doc: "The note kind. Must match this schema." }
  name:     { type: string, required: true, doc: "Display name. Also the file name." }
  parent:   { type: ref, required: true, doc: "The note this one sits under. Every note but the Omniverse has one." }
  aliases:  { type: list, of: string, doc: "Other names it goes by." }
  tags:     { type: list, of: string }
  summary:  { type: text, doc: "One to three sentences for indexes and the app." }
  author:   { type: string, doc: "Who wrote it (GitHub handle)." }
  status:   { type: enum, values: [sample, draft, playtested, canon, stub, active, paused, dormant, archived, retired], doc: "Editorial status." }
in_universe:
  universe: { type: ref, kinds: [universe], required: true, doc: "The universe this note belongs to. Must match the first segment of the id." }
dated:
  from:     { type: when, doc: "When it came to be. `primordial` for things older than the calendar." }
  to:       { type: when, nullable: true, doc: "When it ended. `null` while it still exists." }
manifest:
  version:  { type: string, pattern: '^\d+\.\d+\.\d+$', doc: "Semantic version of this module." }
  owner:    { type: string, doc: "Maintainer (GitHub handle). Mirrored in CODEOWNERS." }
  licence:  { type: enum, values: [Unlicense, CC0-1.0, CC-BY-4.0, CC-BY-SA-4.0, CC-BY-NC-4.0, CC-BY-NC-SA-4.0, CC-BY-3.0, OGL-1.0a, ORC-1.0, other], doc: "Licence of this module's content (SPDX-style id). The folder must also hold a LICENSE.md that names it; see LICENSING.md." }
  licence_url: { type: string, doc: "Link to the licence text. Required when licence is `other`." }
  attribution: { type: text, doc: "The credit line others must reproduce when they reuse this content. Required for every licence except Unlicense and CC0-1.0." }
  requires: { type: map, open: true, doc: 'Module id to version range, e.g. omniverse-core: ">=0.6 <0.7".' }
  extends:  { type: ref, nullable: true, doc: "Module this one builds on." }
  provides: { type: any, doc: "What the module supplies (list or map)." }
  overrides: { type: list, of: string, doc: "Parts of the extended module this one replaces." }
  adds_kinds: { type: list, of: string, doc: "Note kinds this module introduces (declared in its _schemas/)." }
